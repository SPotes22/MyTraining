{% extends 'base.html' %}
{% block title %}Nueva contraseña | MyTraining{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-lg-5 col-md-7 col-sm-10">
    <div class="card border-0 shadow-lg" style="border-radius: 20px;">
      <div class="card-body p-4 p-md-5">
        <h4 class="fw-bold mb-1"><i class="bi bi-shield-lock text-primary me-2"></i>Crea tu nueva contraseña</h4>
        <p class="text-muted small mb-4">Mínimo {{ config.MIN_PASSWORD_LENGTH }} caracteres.</p>
        <form method="post">
          <label class="form-label fw-semibold small text-muted" for="password">Nueva contraseña</label>
          <input id="password" type="password" name="password" class="form-control mb-3" minlength="{{ config.MIN_PASSWORD_LENGTH }}" required autofocus>
          <label class="form-label fw-semibold small text-muted" for="password_confirm">Repite la contraseña</label>
          <input id="password_confirm" type="password" name="password_confirm" class="form-control mb-4" minlength="{{ config.MIN_PASSWORD_LENGTH }}" required>
          <button class="btn btn-primary w-100 py-2 fw-bold">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
