{# RL-01: autorización previa, expresa e informada. Nunca viene marcada; el servidor la exige. #}
<div class="form-check mb-4">
  <input class="form-check-input" type="checkbox" name="accept_terms" id="accept_terms" value="on" required>
  <label class="form-check-label small" for="accept_terms">
    He leído y acepto los <a href="{{ url_for('auth.terms') }}" target="_blank" rel="noopener">Términos y condiciones</a>
    y autorizo el tratamiento de mis datos personales según la
    <a href="{{ url_for('auth.privacy_policy') }}" target="_blank" rel="noopener">Política de tratamiento de datos</a>.
    Declaro que soy mayor de edad o que cuento con la autorización de mi madre, padre o representante legal.
  </label>
</div>
