<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="340" rx="20" fill="#ffffff" stroke="#e6e9ee"/>

  <text x="24" y="42" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="800" fill="#22303f">World Facts Quiz</text>
  <circle cx="222" cy="36" r="8" fill="#e7ebef"/>
  <text x="218.5" y="40" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#6b7a8d">i</text>

  <rect x="700" y="20" width="80" height="32" rx="16" fill="#e3f7fb"/>
  <text x="720" y="41" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#1c9db6">Excel</text>
  <rect x="790" y="20" width="90" height="32" rx="16" fill="#f2f4f6"/>
  <text x="806" y="41" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#22303f">Imprimir</text>

  <!-- toggles -->
  <g font-family="Verdana, Geneva, sans-serif" font-size="12" font-weight="700" fill="#22303f">
    <rect x="24" y="66" width="34" height="18" rx="9" fill="#4caf50"/>
    <circle cx="50" cy="75" r="7" fill="#ffffff"/>
    <text x="64" y="79">Mostrar nombres</text>

    <rect x="190" y="66" width="34" height="18" rx="9" fill="#4caf50"/>
    <circle cx="216" cy="75" r="7" fill="#ffffff"/>
    <text x="230" y="79">Mostrar respuestas</text>

    <rect x="370" y="66" width="34" height="18" rx="9" fill="#4caf50"/>
    <circle cx="396" cy="75" r="7" fill="#ffffff"/>
    <text x="410" y="79">Mostrar resultados</text>
  </g>

  <!-- grid -->
  <g font-family="Verdana, Geneva, sans-serif" font-size="13">
    <!-- headers -->
    <text x="24" y="118" font-weight="700" fill="#6b7a8d">NOMBRE</text>
    <text x="220" y="118" font-weight="700" fill="#6b7a8d">PUNTAJE</text>
    <rect x="320" y="100" width="70" height="26" rx="6" fill="#f0ad4e"/>
    <text x="350" y="118" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="400" y="100" width="70" height="26" rx="6" fill="#5b7fd6"/>
    <text x="430" y="118" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

    <!-- row 1 -->
    <text x="24" y="160" fill="#22303f" font-weight="600">Ana Torres</text>
    <text x="220" y="160" fill="#2e7d32" font-weight="800">100%</text>
    <rect x="320" y="142" width="70" height="26" rx="6" fill="#e6f6e8"/>
    <text x="355" y="160" text-anchor="middle" fill="#2e7d32" font-weight="700">✓</text>
    <rect x="400" y="142" width="70" height="26" rx="6" fill="#e6f6e8"/>
    <text x="435" y="160" text-anchor="middle" fill="#2e7d32" font-weight="700">✓</text>

    <!-- row 2 -->
    <text x="24" y="196" fill="#22303f" font-weight="600">Luis Gomez</text>
    <text x="220" y="196" fill="#c0392b" font-weight="800">50%</text>
    <rect x="320" y="178" width="70" height="26" rx="6" fill="#fbe9e7"/>
    <text x="355" y="196" text-anchor="middle" fill="#c0392b" font-weight="700">✕</text>
    <rect x="400" y="178" width="70" height="26" rx="6" fill="#e6f6e8"/>
    <text x="435" y="196" text-anchor="middle" fill="#2e7d32" font-weight="700">✓</text>

    <!-- row 3 -->
    <text x="24" y="232" fill="#22303f" font-weight="600">Marta Diaz</text>
    <text x="220" y="232" fill="#c0392b" font-weight="800">50%</text>
    <rect x="320" y="214" width="70" height="26" rx="6" fill="#e6f6e8"/>
    <text x="355" y="232" text-anchor="middle" fill="#2e7d32" font-weight="700">✓</text>
    <rect x="400" y="214" width="70" height="26" rx="6" fill="#fbe9e7"/>
    <text x="435" y="232" text-anchor="middle" fill="#c0392b" font-weight="700">✕</text>

    <!-- total -->
    <rect x="0" y="256" width="900" height="34" fill="#f3f5f7"/>
    <text x="24" y="278" font-weight="800" fill="#22303f">Total de la clase</text>
    <text x="355" y="278" text-anchor="middle" font-weight="800" fill="#22303f">66.7%</text>
    <text x="435" y="278" text-anchor="middle" font-weight="800" fill="#22303f">66.7%</text>
  </g>
</svg>
