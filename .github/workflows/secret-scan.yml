name: Secret scan (GitGuardian)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ggshield:
    name: ggshield secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ggshield necesita el historial para calcular el rango de commits

      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.56.0
        env:
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
