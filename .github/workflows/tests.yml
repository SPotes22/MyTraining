name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest + cobertura (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      # RNF-16: la suite completa y una cobertura mínima de 70 % en blueprints y
      # services. Una base SQLite temporal por test; no necesita servicios externos.
      # tests/test_migrations.py falla si un modelo cambió sin su migración (RNF-13).
      - name: Pytest
        run: >
          python -m pytest -q
          --cov=app/blueprints --cov=app/services
          --cov-report=term-missing:skip-covered
          --cov-fail-under=70

  pytest-postgres:
    # RNF-13: el mismo código y las mismas migraciones contra PostgreSQL, que sí
    # revisa llaves foráneas y tipos que SQLite deja pasar.
    name: pytest (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mytraining
          POSTGRES_DB: mytraining_test
          # Contenedor efímero del job, solo accesible dentro del runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mytraining"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mytraining@127.0.0.1:5432/mytraining_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q
